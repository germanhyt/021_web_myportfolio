<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Soft green gradient from portfolio design system -->
    <linearGradient id="bg-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e3eca0" />
      <stop offset="100%" stop-color="#b8c679" />
    </linearGradient>
    <linearGradient id="text-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f270b" />
      <stop offset="100%" stop-color="#0e1304" />
    </linearGradient>
  </defs>

  <!-- Green Background Card from Design System (#d7e0b8) -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#bg-green)" stroke="#9aab5e" stroke-width="4" />

  <!-- Subtle Accent Dot -->
  <circle cx="102" cy="26" r="6" fill="#1f270b" />

  <!-- Monogram g4h -->
  <g text-anchor="middle" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" letter-spacing="-3">
    <!-- 'g' in deep contrast dark olive -->
    <text x="34" y="82" fill="url(#text-dark)">g</text>
    <!-- '4' in deep contrast dark olive -->
    <text x="64" y="82" fill="#000000">4</text>
    <!-- 'h' in deep contrast dark olive -->
    <text x="94" y="82" fill="url(#text-dark)">h</text>
  </g>
</svg>
